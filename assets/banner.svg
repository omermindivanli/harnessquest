<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0914"/>
      <stop offset="50%" stop-color="#0f0c24"/>
      <stop offset="100%" stop-color="#05030a"/>
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="neon-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#60efff"/>
    </linearGradient>
    <linearGradient id="arcade-pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" opacity="0.3"/>
    </pattern>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="460" fill="url(#bg)" rx="16"/>

  <g stroke="#ff007f" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="380" x2="1200" y2="380"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="600" y1="280" x2="-200" y2="460"/>
    <line x1="600" y1="280" x2="100" y2="460"/>
    <line x1="600" y1="280" x2="400" y2="460"/>
    <line x1="600" y1="280" x2="800" y2="460"/>
    <line x1="600" y1="280" x2="1100" y2="460"/>
    <line x1="600" y1="280" x2="1400" y2="460"/>
  </g>

  <!-- Web UI mockup -->
  <g transform="translate(620, 45)">
    <rect width="530" height="370" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <rect width="530" height="38" rx="10" fill="#161b22"/>
    <circle cx="20" cy="19" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="19" r="5" fill="#ffbd2e"/>
    <circle cx="52" cy="19" r="5" fill="#27c93f"/>
    <text x="75" y="23" font-family="'Courier New', monospace" font-weight="bold" font-size="12" fill="#8b949e">127.0.0.1:7777 (HarnessQuest Web UI)</text>

    <rect x="15" y="50" width="500" height="32" rx="6" fill="#1f2937"/>
    <text x="25" y="70" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff">HarnessQuest</text>
    <text x="115" y="70" font-family="sans-serif" font-weight="bold" font-size="10" fill="#38bdf8">Level 1</text>
    <rect x="180" y="62" width="110" height="8" rx="4" fill="#374151"/>
    <rect x="180" y="62" width="60" height="8" rx="4" fill="url(#neon-green)" filter="url(#glow-green)"/>
    <text x="300" y="70" font-family="'Courier New', monospace" font-weight="bold" font-size="11" fill="#f59e0b">250 XP</text>
    <text x="365" y="70" font-family="'Courier New', monospace" font-size="11" fill="#9ca3af">2/20 quests</text>
    <text x="450" y="70" font-family="sans-serif" font-size="12" fill="#38bdf8">🌱 🛡️</text>

    <rect x="15" y="90" width="150" height="265" rx="6" fill="#111827"/>
    <g font-family="sans-serif" font-size="10">
      <rect x="20" y="98" width="140" height="34" rx="4" fill="#1f2937" stroke="#10b981" stroke-width="1"/>
      <text x="26" y="112" font-weight="bold" fill="#10b981">✓ 1. Hello Harness</text>
      <text x="26" y="125" fill="#6b7280" font-size="8">beginner • +100 XP</text>

      <rect x="20" y="136" width="140" height="34" rx="4" fill="#1f2937" stroke="#10b981" stroke-width="1"/>
      <text x="26" y="150" font-weight="bold" fill="#10b981">✓ 2. Sandbox Appr...</text>
      <text x="26" y="163" fill="#6b7280" font-size="8">beginner • +150 XP</text>

      <rect x="20" y="174" width="140" height="34" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="26" y="188" font-weight="bold" fill="#60a5fa">▶ 3. Context Novice</text>
      <text x="26" y="201" fill="#93c5fd" font-size="8">beginner • +150 XP</text>

      <rect x="20" y="212" width="140" height="30" rx="4" fill="#111827"/>
      <text x="26" y="226" font-weight="bold" fill="#6b7280">🔒 4. Token Minimalist</text>
      <rect x="20" y="246" width="140" height="30" rx="4" fill="#111827"/>
      <text x="26" y="260" font-weight="bold" fill="#6b7280">🔒 5. Tool Smith</text>
      <rect x="20" y="280" width="140" height="30" rx="4" fill="#111827"/>
      <text x="26" y="294" font-weight="bold" fill="#6b7280">🔒 6. Guardrail Guardian</text>
    </g>

    <rect x="175" y="90" width="340" height="265" rx="6" fill="#1f2937"/>
    <text x="190" y="112" font-family="sans-serif" font-weight="bold" font-size="13" fill="#ffffff">The idea</text>
    <text x="190" y="128" font-family="sans-serif" font-size="9" fill="#9ca3af">AGENTS.md serves as a table of contents, not an encyclopedia.</text>
    <text x="190" y="152" font-family="sans-serif" font-weight="bold" font-size="13" fill="#60a5fa">Your mission</text>
    <text x="190" y="168" font-family="sans-serif" font-size="9" fill="#f59e0b">Write an AGENTS.md map and verify the agent receives it.</text>

    <rect x="190" y="182" width="310" height="120" rx="4" fill="#111827" stroke="#374151"/>
    <text x="200" y="200" font-family="'Courier New', monospace" font-weight="bold" font-size="10" fill="#38bdf8">AGENTS.md</text>
    <text x="200" y="218" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af"># Map</text>
    <text x="200" y="234" font-family="'Courier New', monospace" font-size="9" fill="#10b981">- src/    the harness code</text>
    <text x="200" y="248" font-family="'Courier New', monospace" font-size="9" fill="#10b981">- tests/  checks that prove it works</text>
    <text x="200" y="262" font-family="'Courier New', monospace" font-size="9" fill="#10b981">- docs/   how the pieces fit together</text>

    <rect x="190" y="312" width="70" height="24" rx="4" fill="#2563eb"/>
    <text x="202" y="328" font-family="sans-serif" font-weight="bold" font-size="9" fill="#ffffff">Run check</text>
    <rect x="268" y="312" width="45" height="24" rx="4" fill="#374151"/>
    <text x="278" y="328" font-family="sans-serif" font-size="9" fill="#d1d5db">Hint</text>
    <rect x="320" y="312" width="45" height="24" rx="4" fill="#374151"/>
    <text x="330" y="328" font-family="sans-serif" font-size="9" fill="#d1d5db">Save</text>
    <rect x="372" y="312" width="128" height="24" rx="4" fill="#374151"/>
    <text x="382" y="328" font-family="sans-serif" font-size="9" fill="#d1d5db">Show reference solution</text>
  </g>

  <!-- Left side branding -->
  <g transform="translate(45, 75)">
    <rect x="0" y="0" width="210" height="28" rx="4" fill="url(#arcade-pink)"/>
    <text x="105" y="18" font-family="'Courier New', monospace" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1">🎮 RETRO ARCADE EDITION</text>

    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="2">HARNESS<tspan fill="url(#neon-cyan)" filter="url(#glow-cyan)">QUEST</tspan></text>

    <text x="0" y="122" font-family="'Courier New', monospace" font-weight="bold" font-size="15" fill="#00ff87" letter-spacing="1">&gt; BUILD YOUR HARNESS. LEVEL UP YOUR AGENT.</text>

    <text x="0" y="150" font-family="sans-serif" font-size="13" fill="#94a3b8">A gamified way to learn harness engineering for AI agents.</text>
    <text x="0" y="168" font-family="sans-serif" font-size="13" fill="#94a3b8">Read the idea, write the code, pass the check, earn XP and badges.</text>

    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="150" height="60" rx="8" fill="#111827" stroke="#00f2fe" stroke-width="1.5"/>
      <text x="15" y="24" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8">QUEST TRACK</text>
      <text x="15" y="46" font-family="sans-serif" font-weight="bold" font-size="18" fill="#00f2fe">20 Quests</text>

      <rect x="165" y="0" width="150" height="60" rx="8" fill="#111827" stroke="#00ff87" stroke-width="1.5"/>
      <text x="180" y="24" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8">REWARD SYSTEM</text>
      <text x="180" y="46" font-family="sans-serif" font-weight="bold" font-size="18" fill="#00ff87">XP &amp; Badges</text>

      <rect x="330" y="0" width="180" height="60" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="345" y="24" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8">LOCAL WEB APP UI</text>
      <text x="345" y="46" font-family="sans-serif" font-weight="bold" font-size="18" fill="#f59e0b">127.0.0.1:7777</text>
    </g>

    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="510" height="42" rx="6" fill="#030712" stroke="#1f2937" stroke-width="1.5"/>
      <text x="15" y="26" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#00ff87">$ pip install -e . &amp;&amp; harnessquest-play</text>
    </g>

    <g transform="translate(0, 335)" font-family="'Courier New', monospace" font-size="11" font-weight="bold">
      <text x="0" y="0" fill="#a855f7">⚡ One-Shot Sniper</text>
      <text x="150" y="0" fill="#38bdf8">🗺️ Context Novice</text>
      <text x="300" y="0" fill="#f59e0b">🛡️ Guardrail Guardian</text>
    </g>
  </g>

  <rect width="1200" height="460" fill="url(#scanlines)" pointer-events="none"/>
</svg>
