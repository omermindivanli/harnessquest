<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-arch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0914"/>
      <stop offset="100%" stop-color="#05030a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="480" fill="url(#bg-arch)" rx="12"/>

  <text x="500" y="45" font-family="'Courier New', monospace" font-weight="bold" font-size="22" fill="#00ff87" text-anchor="middle" letter-spacing="2">🎮 HARNESSQUEST: ARCHITECTURE FLOW</text>

  <g transform="translate(30, 80)">
    <rect width="200" height="340" rx="10" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
    <rect width="200" height="40" rx="10" fill="#1e3a8a"/>
    <text x="100" y="25" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">1. MAP &amp; PROMPT</text>
    <rect x="15" y="60" width="170" height="65" rx="6" fill="#030712" stroke="#1f2937"/>
    <text x="100" y="85" font-family="sans-serif" font-weight="bold" font-size="12" fill="#60a5fa" text-anchor="middle">User Goal / Prompt</text>
    <text x="100" y="105" font-family="'Courier New', monospace" font-size="10" fill="#9ca3af" text-anchor="middle">Any task you give the agent</text>
    <text x="100" y="155" font-family="sans-serif" font-size="18" fill="#60a5fa" text-anchor="middle">+</text>
    <rect x="15" y="175" width="170" height="135" rx="6" fill="#030712" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="100" y="200" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#00f2fe" text-anchor="middle">AGENTS.md Map</text>
    <text x="100" y="222" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Table of Contents</text>
    <text x="100" y="240" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Progressive Disclosure</text>
    <rect x="25" y="255" width="150" height="35" rx="4" fill="#064e3b"/>
    <text x="100" y="276" font-family="'Courier New', monospace" font-size="10" fill="#34d399" text-anchor="middle">SHORT map (40-8k chars)</text>
  </g>
  <path d="M 240 250 L 270 250" stroke="#00f2fe" stroke-width="3" stroke-dasharray="4 4"/>

  <g transform="translate(280, 80)">
    <rect width="220" height="340" rx="10" fill="#111827" stroke="#10b981" stroke-width="2"/>
    <rect width="220" height="40" rx="10" fill="#065f46"/>
    <text x="110" y="25" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">2. QUEST ENGINE</text>
    <rect x="15" y="60" width="190" height="70" rx="6" fill="#030712" stroke="#1f2937"/>
    <text x="105" y="85" font-family="sans-serif" font-weight="bold" font-size="12" fill="#34d399" text-anchor="middle">Web UI (127.0.0.1:7777)</text>
    <text x="105" y="105" font-family="'Courier New', monospace" font-size="10" fill="#6b7280" text-anchor="middle">Interactive Quest Track</text>
    <rect x="15" y="145" width="190" height="70" rx="6" fill="#030712" stroke="#1f2937"/>
    <text x="105" y="170" font-family="sans-serif" font-weight="bold" font-size="12" fill="#34d399" text-anchor="middle">ContextEngine</text>
    <text x="105" y="190" font-family="'Courier New', monospace" font-size="10" fill="#6b7280" text-anchor="middle">Loads &amp; Injects the Map</text>
    <rect x="15" y="230" width="190" height="70" rx="6" fill="#030712" stroke="#1f2937"/>
    <text x="105" y="255" font-family="sans-serif" font-weight="bold" font-size="12" fill="#34d399" text-anchor="middle">LiteLLM / Model Loop</text>
    <text x="105" y="275" font-family="'Courier New', monospace" font-size="10" fill="#6b7280" text-anchor="middle">Claude / GPT-4o / Ollama / Mock</text>
  </g>
  <path d="M 510 250 L 540 250" stroke="#00ff87" stroke-width="3" stroke-dasharray="4 4"/>

  <g transform="translate(550, 80)">
    <rect width="200" height="340" rx="10" fill="#111827" stroke="#a855f7" stroke-width="2"/>
    <rect width="200" height="40" rx="10" fill="#581c87"/>
    <text x="100" y="25" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">3. GUARDED SANDBOX</text>
    <rect x="15" y="60" width="170" height="70" rx="6" fill="#030712" stroke="#1f2937"/>
    <text x="100" y="85" font-family="sans-serif" font-weight="bold" font-size="12" fill="#c084fc" text-anchor="middle">Execution Guardrail</text>
    <text x="100" y="105" font-family="'Courier New', monospace" font-size="10" fill="#6b7280" text-anchor="middle">Allowlist, no shell</text>
    <rect x="15" y="145" width="170" height="70" rx="6" fill="#030712" stroke="#1f2937"/>
    <text x="100" y="170" font-family="sans-serif" font-weight="bold" font-size="12" fill="#c084fc" text-anchor="middle">File System Isolation</text>
    <text x="100" y="190" font-family="'Courier New', monospace" font-size="10" fill="#6b7280" text-anchor="middle">Workspace path locking</text>
    <rect x="15" y="230" width="170" height="70" rx="6" fill="#030712" stroke="#1f2937"/>
    <text x="100" y="255" font-family="sans-serif" font-weight="bold" font-size="12" fill="#c084fc" text-anchor="middle">Verification Warden</text>
    <text x="100" y="275" font-family="'Courier New', monospace" font-size="10" fill="#6b7280" text-anchor="middle">Runs your code, checks it</text>
  </g>
  <path d="M 760 250 L 790 250" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 4"/>

  <g transform="translate(800, 80)">
    <rect width="170" height="340" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <rect width="170" height="40" rx="10" fill="#78350f"/>
    <text x="85" y="25" font-family="'Courier New', monospace" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">4. XP &amp; PROGRESS</text>
    <rect x="15" y="65" width="140" height="70" rx="6" fill="#030712" stroke="#f59e0b"/>
    <text x="85" y="90" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#fbbf24" text-anchor="middle">+100 to +1000 XP</text>
    <text x="85" y="110" font-family="sans-serif" font-size="10" fill="#fcd34d" text-anchor="middle">Level Progression</text>
    <rect x="15" y="150" width="140" height="150" rx="6" fill="#030712" stroke="#1f2937"/>
    <text x="85" y="175" font-family="sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle">20 Quest Ranks</text>
    <text x="85" y="198" font-family="'Courier New', monospace" font-size="10" fill="#34d399" text-anchor="middle">✓ Beginner</text>
    <text x="85" y="218" font-family="'Courier New', monospace" font-size="10" fill="#60a5fa" text-anchor="middle">Intermediate</text>
    <text x="85" y="238" font-family="'Courier New', monospace" font-size="10" fill="#c084fc" text-anchor="middle">Advanced / Expert</text>
    <text x="85" y="265" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle">🏆 Badges</text>
  </g>
</svg>
