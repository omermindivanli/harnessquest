name: HarnessQuest PR Evaluation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quest-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (offline, no API key needed)
        run: pytest -q

      - name: Smoke test the CLI with the offline mock provider
        run: |
          harnessquest --prompt "List the files" --provider mock --model mock
          harnessquest-quest --list
