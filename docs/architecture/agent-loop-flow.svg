<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="700" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Agent Loop Flow Diagram -->
  <defs>
    <style>
      .node { fill: #1e1e2e; stroke: #89b4fa; stroke-width: 2; rx: 10; }
      .node-start { fill: #1e1e2e; stroke: #a6e3a1; stroke-width: 3; rx: 20; }
      .node-end { fill: #1e1e2e; stroke: #f38ba8; stroke-width: 3; rx: 20; }
      .node-decision { fill: #1e1e2e; stroke: #f9e2af; stroke-width: 2; rx: 10; transform: rotate(45); }
      .node-action { fill: #1e1e2e; stroke: #fab387; stroke-width: 2; rx: 10; }
      .node-gamify { fill: #1e1e2e; stroke: #f5c2e7; stroke-width: 2; rx: 10; }
      .label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #cdd6f4; text-anchor: middle; }
      .label-bold { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: bold; fill: #89b4fa; text-anchor: middle; }
      .arrow { stroke: #f9e2af; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .arrow-yes { stroke: #a6e3a1; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .arrow-no { stroke: #f38ba8; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .arrow-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #f9e2af; }
      .phase-box { fill: #11111b; stroke: #313244; stroke-width: 1; rx: 8; }
      .phase-title { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: bold; fill: #89b4fa; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f9e2af" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="#11111b"/>
  
  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" class="phase-title" font-size="20">HarnessQuest Agent Loop Flow</text>
  <text x="500" y="55" text-anchor="middle" class="label" font-size="11">Observe → Reason → Act → Repeat (with Gamification)</text>
  
  <!-- Phase Backgrounds -->
  <rect x="30" y="80" width="460" height="580" class="phase-box"/>
  <text x="50" y="105" class="phase-title">PHASE 1: INITIALIZATION</text>
  
  <rect x="510" y="80" width="460" height="280" class="phase-box"/>
  <text x="530" y="105" class="phase-title">PHASE 2: AGENT LOOP</text>
  
  <rect x="510" y="380" width="460" height="280" class="phase-box"/>
  <text x="530" y="405" class="phase-title">PHASE 3: COMPLETION & REWARDS</text>
  
  <!-- INITIALIZATION NODES -->
  <g transform="translate(80, 140)">
    <!-- Start -->
    <ellipse cx="175" cy="30" rx="120" ry="35" class="node-start"/>
    <text x="175" y="25" class="label-bold">🚀 START</text>
    <text x="175" y="42" class="label">parse_args() → config</text>
    
    <!-- Provider Setup -->
    <rect x="55" y="90" width="240" height="60" class="node"/>
    <text x="175" y="120" class="label-bold">🔧 Provider Setup</text>
    <text x="175" y="140" class="label">get_provider(provider_name)</text>
    <text x="175" y="155" class="label">validate_config()</text>
    
    <!-- Runner Init -->
    <rect x="55" y="175" width="240" height="60" class="node"/>
    <text x="175" y="205" class="label-bold">⚙️ HarnessRunner Init</text>
    <text x="175" y="225" class="label">ContextEngine + Sandbox</text>
    <text x="175" y="240" class="label">GamificationEngine</text>
    
    <!-- Context Load -->
    <rect x="55" y="260" width="240" height="60" class="node"/>
    <text x="175" y="290" class="label-bold">📚 Context Loading</text>
    <text x="175" y="310" class="label">ContextEngine.load_repo_map()</text>
    <text x="175" y="325" class="label">AGENTS.md or tree fallback</text>
    
    <!-- Loop Entry -->
    <ellipse cx="175" cy="380" rx="120" ry="35" class="node-start"/>
    <text x="175" y="375" class="label-bold">🔄 ENTER LOOP</text>
    <text x="175" y="392" class="label">turn = 0, history = []</text>
    
    <!-- Arrows -->
    <path d="M 175 65 V 90" class="arrow"/>
    <path d="M 175 150 V 175" class="arrow"/>
    <path d="M 175 235 V 260" class="arrow"/>
    <path d="M 175 320 V 345" class="arrow"/>
  </g>
  
  <!-- AGENT LOOP NODES (Right side, top) -->
  <g transform="translate(540, 140)">
    <!-- Turn Counter -->
    <rect x="30" y="10" width="180" height="50" class="node-action"/>
    <text x="120" y="38" text-anchor="middle" class="label-bold">🔢 Turn Counter</text>
    <text x="120" y="52" text-anchor="middle" class="label">turn += 1 (max: 10)</text>
    
    <!-- Assemble Context -->
    <rect x="30" y="75" width="180" height="60" class="node"/>
    <text x="120" y="103" text-anchor="middle" class="label-bold">🧠 Assemble Context</text>
    <text x="120" y="120" text-anchor="middle" class="label">ContextEngine.assemble_context()</text>
    <text x="120" y="135" text-anchor="middle" class="label">system + history + prompt</text>
    
    <!-- LLM Call -->
    <rect x="30" y="150" width="180" height="60" class="node-action"/>
    <text x="120" y="178" text-anchor="middle" class="label-bold">🤖 LLM Completion</text>
    <text x="120" y="193" text-anchor="middle" class="label">provider.complete()</text>
    <text x="120" y="208" text-anchor="middle" class="label">track tokens</text>
    
    <!-- Decision: Task Complete? -->
    <g transform="translate(120, 240) rotate(45)">
      <rect x="-40" y="-40" width="80" height="80" class="node-decision"/>
      <text x="0" y="-5" text-anchor="middle" class="label-bold" font-size="10">[TASK_COMPLETE]?</text>
    </g>
    
    <!-- YES Path - to completion -->
    <path d="M 120 280 V 310" class="arrow-yes"/>
    <text x="100" y="295" class="label" font-size="9">YES</text>
    
    <!-- NO Path - to Tool Check -->
    <path d="M 120 280 H 200 V 320" class="arrow-no"/>
    <text x="210" y="285" class="label" font-size="9">NO</text>
    
    <!-- Tool Check -->
    <g transform="translate(200, 300)">
      <rect x="-40" y="-40" width="80" height="80" class="node-decision" transform="rotate(45)"/>
      <text x="0" y="-5" text-anchor="middle" class="label-bold" font-size="10">RUN: cmd?</text>
    </g>
    
    <!-- YES - Execute Tool -->
    <path d="M 200 340 V 370" class="arrow-yes"/>
    <text x="220" y="355" class="label" font-size="9">YES</text>
    
    <rect x="160" y="385" width="160" height="60" class="node-action" transform="translate(-20, 0)"/>
    <text x="240" y="413" text-anchor="middle" class="label-bold">⚡ Execute Tool</text>
    <text x="240" y="428" text-anchor="middle" class="label">sandbox.run_command(cmd)</text>
    <text x="240" y="443" text-anchor="middle" class="label">capture stdout/stderr</text>
    
    <!-- NO - Prompt Continue -->
    <path d="M 200 340 H 100 V 420" class="arrow-no"/>
    <text x="70" y="355" class="label" font-size="9">NO</text>
    
    <rect x="20" y="405" width="160" height="50" class="node" transform="translate(-20, 0)"/>
    <text x="100" y="430" text-anchor="middle" class="label-bold">💬 Prompt Continue</text>
    <text x="100" y="445" text-anchor="middle" class="label">"Proceed or [TASK_COMPLETE]"</text>
    
    <!-- Loop back arrows -->
    <path d="M 100 455 V 500 H -100 V 10" class="arrow" style="stroke-dasharray: 5,5;"/>
    <text x="-80" y="250" class="label" font-size="9">NEXT TURN</text>
  </g>
  
  <!-- COMPLETION & REWARDS (Right side, bottom) -->
  <g transform="translate(540, 420)">
    <!-- Success Node -->
    <ellipse cx="120" cy="30" rx="150" ry="40" class="node-end"/>
    <text x="120" y="22" text-anchor="middle" class="label-bold" font-size="14">✅ QUEST SUCCESS</text>
    <text x="120" y="42" text-anchor="middle" class="label">status = "success"</text>
    
    <!-- Gamification Evaluation -->
    <rect x="30" y="90" width="180" height="80" class="node-gamify"/>
    <text x="120" y="115" text-anchor="middle" class="label-bold">🎮 Gamification</text>
    <text x="120" y="135" text-anchor="middle" class="label">GamificationEngine.evaluate_run()</text>
    <text x="120" y="150" text-anchor="middle" class="label">turns, tokens, duration, faults</text>
    <text x="120" y="165" text-anchor="middle" class="label">→ XP, Level, Badges</text>
    
    <!-- Stats Display -->
    <rect x="30" y="185" width="180" height="70" class="node-gamify"/>
    <text x="120" y="210" text-anchor="middle" class="label-bold">📊 Stats & Rewards</text>
    <text x="120" y="230" text-anchor="middle" class="label">Level, Total XP, Badges</text>
    <text x="120" y="245" text-anchor="middle" class="label">Duration, Turns, Tokens</text>
    
    <!-- Failure Path (from loop) -->
    <ellipse cx="380" cy="30" rx="120" ry="35" class="node-end" style="stroke: #f38ba8;"/>
    <text x="380" y="22" text-anchor="middle" class="label-bold" fill="#f38ba8">❌ MAX TURNS</text>
    <text x="380" y="42" text-anchor="middle" class="label" fill="#f38ba8">status = "max_turns_exceeded"</text>
    
    <!-- Error Path -->
    <ellipse cx="380" cy="120" rx="120" ry="35" class="node-end" style="stroke: #f38ba8;"/>
    <text x="380" y="112" text-anchor="middle" class="label-bold" fill="#f38ba8">💥 ERROR</text>
    <text x="380" y="132" text-anchor="middle" class="label" fill="#f38ba8">status = "error"</text>
    
    <!-- Output Summary -->
    <rect x="30" y="270" width="180" height="50" class="node"/>
    <text x="120" y="292" text-anchor="middle" class="label-bold">📝 Output Summary</text>
    <text x="120" y="307" text-anchor="middle" class="label">Return result dict</text>
    
    <!-- Arrows -->
    <path d="M 120 70 V 90" class="arrow"/>
    <path d="M 120 170 V 185" class="arrow"/>
    <path d="M 120 255 V 270" class="arrow"/>
  </g>
  
  <!-- CONNECTION FROM LOOP TO COMPLETION -->
  <path d="M 720 300 V 420" class="arrow-yes" style="stroke-width: 3;"/>
  <text x="730" y="360" class="label-bold" fill="#a6e3a1">[TASK_COMPLETE] found</text>
  
  <path d="M 600 550 V 420" class="arrow-no" style="stroke-width: 3; stroke-dasharray: 10,5;"/>
  <text x="580" y="480" class="label-bold" fill="#f38ba8">Max turns exceeded</text>
  
  <path d="M 600 200 V 420" class="arrow" style="stroke: #f38ba8; stroke-width: 3; stroke-dasharray: 10,5;"/>
  <text x="580" y="300" class="label-bold" fill="#f38ba8">Exception caught</text>
  
  <!-- Legend -->
  <g transform="translate(30, 670)">
    <text x="0" y="0" class="label">Legend:</text>
    <rect x="60" y="-12" width="20" height="20" rx="5" class="node-start"/>
    <text x="90" y="0" class="label" font-size="10">Start/Init</text>
    <rect x="180" y="-12" width="20" height="20" rx="5" class="node-action"/>
    <text x="210" y="0" class="label" font-size="10">Action</text>
    <rect x="280" y="-12" width="20" height="20" rx="5" class="node"/>
    <text x="310" y="0" class="label" font-size="10">Process</text>
    <g transform="translate(400, -5) rotate(45)">
      <rect x="-10" y="-10" width="20" height="20" class="node-decision"/>
    </g>
    <text x="430" y="0" class="label" font-size="10">Decision</text>
    <ellipse cx="500" cy="0" rx="25" ry="12" class="node-end"/>
    <text x="535" y="0" class="label" font-size="10">End</text>
    <ellipse cx="620" cy="0" rx="25" ry="12" class="node-gamify"/>
    <text x="655" y="0" class="label" font-size="10">Gamify</text>
  </g>
</svg>