<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="650" viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Context Engineering Pipeline -->
  <defs>
    <style>
      .stage-box { fill: #1e1e2e; stroke: #89b4fa; stroke-width: 2; rx: 10; }
      .stage-title { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: bold; fill: #89b4fa; text-anchor: middle; }
      .stage-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #cdd6f4; text-anchor: middle; }
      .step-box { fill: #2e2e3e; stroke: #fab387; stroke-width: 1; rx: 6; }
      .step-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: bold; fill: #fab387; text-anchor: middle; }
      .step-text { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #cdd6f4; text-anchor: middle; }
      .data-box { fill: #1e1e2e; stroke: #a6e3a1; stroke-width: 2; rx: 8; }
      .data-title { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: bold; fill: #a6e3a1; text-anchor: middle; }
      .data-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #cdd6f4; text-anchor: middle; }
      .arrow { stroke: #f9e2af; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .arrow-dashed { stroke: #f9e2af; stroke-width: 1; stroke-dasharray: 5,5; marker-end: url(#arrowhead); fill: none; }
      .arrow-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #f9e2af; text-anchor: middle; }
      .principle-box { fill: #11111b; stroke: #313244; stroke-width: 1; rx: 8; }
      .principle-title { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: bold; fill: #f5c2e7; }
      .principle-text { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #cdd6f4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f9e2af" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="650" fill="#11111b"/>
  
  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" class="stage-title" font-size="22">Context Engineering Pipeline</text>
  <text x="500" y="55" text-anchor="middle" class="stage-text" font-size="11">"Give the agent a map, not a 1000-page manual" — OpenAI Codex Team</text>
  
  <!-- PIPELINE STAGES (Horizontal Flow) -->
  <!-- Stage 1: SOURCE -->
  <g transform="translate(30, 90)">
    <rect x="0" y="0" width="180" height="160" class="stage-box"/>
    <text x="90" y="25" class="stage-title">📂 SOURCE</text>
    
    <g transform="translate(10, 40)">
      <rect x="0" y="0" width="160" height="110" class="step-box"/>
      <text x="80" y="20" class="step-title">Repository Files</text>
      <text x="80" y="40" class="step-text">AGENTS.md (map)</text>
      <text x="80" y="55" class="step-text">docs/ (deep docs)</text>
      <text x="80" y="70" class="step-text">feature_list.json</text>
      <text x="80" y="85" class="step-text">ARCHITECTURE.md</text>
      <text x="80" y="100" class="step-text">*.py, *.md, *.json</text>
    </g>
  </g>
  
  <path d="M 210 170 H 250" class="arrow"/>
  <text x="230" y="160" class="arrow-label">read / scan</text>
  
  <!-- Stage 2: LOAD -->
  <g transform="translate(270, 90)">
    <rect x="0" y="0" width="180" height="160" class="stage-box"/>
    <text x="90" y="25" class="stage-title">🔄 LOAD</text>
    
    <g transform="translate(10, 40)">
      <rect x="0" y="0" width="160" height="110" class="step-box"/>
      <text x="80" y="20" class="step-title">ContextEngine.load_repo_map()</text>
      <text x="80" y="40" class="step-text">If AGENTS.md exists:</text>
      <text x="80" y="55" class="step-text">  → return full content</text>
      <text x="80" y="70" class="step-text">Else:</text>
      <text x="80" y="85" class="step-text">  → generate tree map</text>
      <text x="80" y="100" class="step-text">  → max 50 entries</text>
    </g>
  </g>
  
  <path d="M 450 170 H 490" class="arrow"/>
  <text x="470" y="160" class="arrow-label">repo_map string</text>
  
  <!-- Stage 3: ASSEMBLE -->
  <g transform="translate(510, 90)">
    <rect x="0" y="0" width="180" height="160" class="stage-box"/>
    <text x="90" y="25" class="stage-title">🧩 ASSEMBLE</text>
    
    <g transform="translate(10, 40)">
      <rect x="0" y="0" width="160" height="110" class="step-box"/>
      <text x="80" y="20" class="step-title">assemble_context()</text>
      <text x="80" y="40" class="step-text">1. System prompt base</text>
      <text x="80" y="55" class="step-text">2. + REPOSITORY HARNESS</text>
      <text x="80" y="70" class="step-text">   CONTEXT (repo_map)</text>
      <text x="80" y="85" class="step-text">3. + Rules: boundaries,</text>
      <text x="80" y="100" class="step-text">   [TASK_COMPLETE] signal</text>
    </g>
  </g>
  
  <path d="M 690 170 H 730" class="arrow"/>
  <text x="710" y="160" class="arrow-label">messages[]</text>
  
  <!-- Stage 4: INJECT -->
  <g transform="translate(750, 90)">
    <rect x="0" y="0" width="220" height="160" class="stage-box"/>
    <text x="110" y="25" class="stage-title">💉 INJECT INTO LLM</text>
    
    <g transform="translate(10, 40)">
      <rect x="0" y="0" width="200" height="110" class="step-box"/>
      <text x="100" y="20" class="step-title">Messages Structure</text>
      <text x="100" y="40" class="step-text">[</text>
      <text x="120" y="55" class="step-text">{role: "system", content: ...}</text>
      <text x="120" y="70" class="step-text">{role: "user", content: prompt}</text>
      <text x="120" y="85" class="step-text">{role: "assistant", content: ...}</text>
      <text x="100" y="100" class="step-text">]</text>
    </g>
  </g>
  
  <!-- OPTIMIZATION LAYER (Below) -->
  <g transform="translate(30, 280)">
    <rect x="0" y="0" width="940" height="340" class="stage-box"/>
    <text x="470" y="25" text-anchor="middle" class="stage-title" font-size="16">⚡ OPTIMIZATION LAYER (Advanced Levels 4, 15)</text>
    
    <!-- Token Budget -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="280" height="140" class="data-box"/>
      <text x="140" y="25" text-anchor="middle" class="data-title">💰 Token Budget Management</text>
      <text x="140" y="50" text-anchor="middle" class="data-text">• Target: <2000 tokens/run (MINIMALIST badge)</text>
      <text x="140" y="65" text-anchor="middle" class="data-text">• Base: 100 XP + (2000-tokens)×0.1 bonus</text>
      <text x="140" y="80" text-anchor="middle" class="data-text">• Summarize history, not full conversation</text>
      <text x="140" y="95" text-anchor="middle" class="data-text">• Tool masking: show only relevant tools</text>
      <text x="140" y="110" text-anchor="middle" class="data-text">• KV-cache optimization (Manus pattern)</text>
      <text x="140" y="125" text-anchor="middle" class="data-text">• Progressive disclosure (OpenAI pattern)</text>
    </g>
    
    <!-- Progressive Disclosure -->
    <g transform="translate(320, 40)">
      <rect x="0" y="0" width="280" height="140" class="data-box"/>
      <text x="140" y="25" text-anchor="middle" class="data-title">🔍 Progressive Disclosure</text>
      <text x="140" y="50" text-anchor="middle" class="data-text">Level 1: AGENTS.md (map only, ~100 lines)</text>
      <text x="140" y="65" text-anchor="middle" class="data-text">Level 2: Repo tree (files + structure)</text>
      <text x="140" y="80" text-anchor="middle" class="data-text">Level 3: docs/ deep dive (on demand)</text>
      <text x="140" y="95" text-anchor="middle" class="data-text">Level 4: feature_list.json (specs)</text>
      <text x="140" y="110" text-anchor="middle" class="data-text">Level 5: Full file contents (surgical)</text>
      <text x="140" y="125" text-anchor="middle" class="data-text">Agent learns WHERE to look, not WHAT</text>
    </g>
    
    <!-- Condensation (Level 15) -->
    <g transform="translate(620, 40)">
      <rect x="0" y="0" width="280" height="140" class="data-box"/>
      <text x="140" y="25" text-anchor="middle" class="data-title">📦 Conversation Condensation (L15)</text>
      <text x="140" y="50" text-anchor="middle" class="data-text">OpenHands pattern:</text>
      <text x="140" y="65" text-anchor="middle" class="data-text">• Keep: Original goal + current plan</text>
      <text x="140" y="80" text-anchor="middle" class="data-text">• Keep: Critical files + failing tests</text>
      <text x="140" y="95" text-anchor="middle" class="data-text">• Keep: Last 5 turns (full detail)</text>
      <text x="140" y="110" text-anchor="middle" class="data-text">• Summarize: Older turns → bullet points</text>
      <text x="140" y="125" text-anchor="middle" class="data-text">• Tool masking per phase</text>
    </g>
    
    <!-- File-based Memory (Level 8) -->
    <g transform="translate(20, 200)">
      <rect x="0" y="0" width="280" height="120" class="data-box"/>
      <text x="140" y="25" text-anchor="middle" class="data-title">💾 File-Based Memory (L8)</text>
      <text x="140" y="50" text-anchor="middle" class="data-text">Anthropic pattern:</text>
      <text x="140" y="65" text-anchor="middle" class="data-text">• feature_list.json: 200+ features</text>
      <text x="140" y="80" text-anchor="middle" class="data-text">• Status: failing → passing</text>
      <text x="140" y="95" text-anchor="middle" class="data-text">• Handoff artifacts between sessions</text>
      <text x="140" y="110" text-anchor="middle" class="data-text">• Initializer agent sets up env</text>
    </g>
    
    <!-- Spec-Driven (Level 14) -->
    <g transform="translate(320, 200)">
      <rect x="0" y="0" width="280" height="120" class="data-box"/>
      <text x="140" y="25" text-anchor="middle" class="data-title">📋 Spec-Driven (L14, WalkingLabs)</text>
      <text x="140" y="50" text-anchor="middle" class="data-text">• feature_list.json = source of truth</text>
      <text x="140" y="65" text-anchor="middle" class="data-text">• AGENTS.md = how to work</text>
      <text x="140" y="80" text-anchor="middle" class="data-text">• Agent executes from spec</text>
      <text x="140" y="95" text-anchor="middle" class="data-text">• Verify → update status</text>
      <text x="140" y="110" text-anchor="middle" class="data-text">• 1M lines, 3 engineers (OpenAI)</text>
    </g>
    
    <!-- Context Window Limits -->
    <g transform="translate(620, 200)">
      <rect x="0" y="0" width="280" height="120" class="data-box"/>
      <text x="140" y="25" text-anchor="middle" class="data-title">📏 Context Window Limits</text>
      <text x="140" y="50" text-anchor="middle" class="data-text">GPT-4o: 128K | Claude 3.5: 200K</text>
      <text x="140" y="65" text-anchor="middle" class="data-text">Llama 3.1: 128K | Local: 8K-128K</text>
      <text x="140" y="80" text-anchor="middle" class="data-text">Budget allocation:</text>
      <text x="140" y="95" text-anchor="middle" class="data-text">  System: ~2K | Context: ~5K</text>
      <text x="140" y="110" text-anchor="middle" class="data-text">  History: ~10K | Task: ~20K</text>
    </g>
  </g>
  
  <!-- KEY PRINCIPLES (Right Side) -->
  <g transform="translate(30, 635)">
    <text x="0" y="0" class="principle-title">Key Principles (from OpenAI, Anthropic, Manus, WalkingLabs):</text>
  </g>
  
  <g transform="translate(30, 440)">
    <rect x="0" y="0" width="940" height="180" class="principle-box"/>
    <text x="20" y="20" class="principle-title">1. Map, Not Manual (OpenAI)</text>
    <text x="40" y="40" class="principle-text">AGENTS.md is a table of contents (~100 lines), not an encyclopedia. Agents start with a map and learn where to look.</text>
    <text x="20" y="65" class="principle-title">2. Initializer + Coding Agent (Anthropic)</text>
    <text x="40" y="85" class="principle-text">Initializer sets up env (feature_list.json with 200+ failing features). Coding agent makes incremental progress, leaves handoff artifacts.</text>
    <text x="20" y="110" class="principle-title">3. KV-Cache Optimization (Manus)</text>
    <text x="40" y="130" class="principle-text">Preserve cache locality: keep useful failures in-context, use filesystem memory, tool masking. Condense conversation preserving goals + progress + critical files.</text>
    <text x="20" y="155" class="principle-title">4. Spec-Driven Development (WalkingLabs)</text>
    <text x="40" y="175" class="principle-text">feature_list.json defines WHAT. AGENTS.md defines HOW. Agents execute from specs. WalkingLabs course teaches this end-to-end.</text>
  </g>
  
  <!-- FLOW ARROWS (Vertical from pipeline to optimization) -->
  <path d="M 120 250 V 280" class="arrow-dashed"/>
  <text x="110" y="265" class="arrow-label">budget</text>
  
  <path d="M 410 250 V 280" class="arrow-dashed"/>
  <text x="400" y="265" class="arrow-label">disclosure</text>
  
  <path d="M 760 250 V 280" class="arrow-dashed"/>
  <text x="750" y="265" class="arrow-label">condense</text>
</svg>