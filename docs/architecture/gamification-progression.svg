<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="700" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Gamification Progression Tree -->
  <defs>
    <style>
      .level-node { fill: #1e1e2e; stroke: #89b4fa; stroke-width: 2; rx: 8; }
      .level-node-completed { fill: #1e1e2e; stroke: #a6e3a1; stroke-width: 3; rx: 8; }
      .level-node-current { fill: #1e1e2e; stroke: #f9e2af; stroke-width: 3; rx: 8; }
      .level-node-locked { fill: #11111b; stroke: #313244; stroke-width: 1; rx: 8; opacity: 0.6; }
      .level-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: bold; fill: #cdd6f4; text-anchor: middle; }
      .level-title-locked { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: bold; fill: #6c7086; text-anchor: middle; }
      .level-xp { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #f9e2af; text-anchor: middle; }
      .level-badge { font-family: 'JetBrains Mono', monospace; font-size: 14px; text-anchor: middle; }
      .level-diff { font-family: 'JetBrains Mono', monospace; font-size: 8px; fill: #fab387; text-anchor: middle; }
      .tier-label { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: bold; fill: #89b4fa; }
      .tier-line { stroke: #313244; stroke-width: 1; stroke-dasharray: 5,5; }
      .connector { stroke: #585b70; stroke-width: 2; fill: none; }
      .connector-active { stroke: #f9e2af; stroke-width: 2; fill: none; }
      .legend-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #cdd6f4; }
      .legend-swatch { width: 20; height: 20; rx: 4; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="#11111b"/>
  
  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" class="tier-label" font-size="20">🎮 HarnessQuest 20-Level Progression Tree</text>
  <text x="500" y="55" text-anchor="middle" class="legend-text">Beginner → Intermediate → Advanced → Expert → Grandmaster</text>
  
  <!-- TIER LABELS -->
  <g transform="translate(30, 85)">
    <text x="0" y="0" class="tier-label" fill="#a6e3a1">TIER 1: FOUNDATION (Levels 1-4)</text>
    <text x="0" y="15" class="legend-text">Core harness concepts: loop, sandbox, context, tokens</text>
  </g>
  <g transform="translate(30, 240)">
    <text x="0" y="0" class="tier-label" fill="#89b4fa">TIER 2: ENGINEERING (Levels 5-9)</text>
    <text x="0" y="15" class="legend-text">Tools, constraints, verification, memory, multi-provider</text>
  </g>
  <g transform="translate(30, 395)">
    <text x="0" y="0" class="tier-label" fill="#fab387">TIER 3: SPECIALIZATION (Levels 10-14)</text>
    <text x="0" y="15" class="legend-text">Local LLMs, NIM, observability, multi-agent, spec-driven</text>
  </g>
  <g transform="translate(30, 550)">
    <text x="0" y="0" class="tier-label" fill="#f5c2e7">TIER 4: MASTERY (Levels 15-20)</text>
    <text x="0" y="15" class="legend-text">Context condensation, security, eval, architecture, production, capstone</text>
  </g>
  
  <!-- LEVEL NODES -->
  <!-- Row 1: Levels 1-4 -->
  <g transform="translate(50, 115)">
    <!-- Level 1 -->
    <g id="lvl1" transform="translate(0, 0)">
      <rect x="0" y="0" width="140" height="100" class="level-node-current"/>
      <text x="70" y="18" class="level-badge">🌱</text>
      <text x="70" y="38" class="level-title">1. INITIATE</text>
      <text x="70" y="55" class="level-title">Hello Harness</text>
      <text x="70" y="72" class="level-xp">+100 XP</text>
      <text x="70" y="87" class="level-diff">BEGINNER</text>
    </g>
    
    <!-- Level 2 -->
